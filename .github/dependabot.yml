# Atualizações de dependência como pull request, para não descobrir que algo
# envelheceu só quando quebra.
#
# Semanal, e não diário, porque cada PR pede revisão: num projeto de uma pessoa,
# ruído demais vira PR ignorado, que é pior que nenhum aviso.
version: 2

updates:
  # As versões das actions no ci.yml (`@v5`) não se atualizam sozinhas.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
    # AGRUPAR NÃO É SÓ REDUZIR RUÍDO: pacotes que só resolvem juntos precisam
    # subir no mesmo PR. A primeira rodada provou isso — o React 18→19 saiu
    # partido em dois PRs, `react` num e `react-dom` no outro, e os dois
    # falharam no `npm ci` com ERESOLVE porque cada metade exige a outra.
    #
    # Um pacote entra no PRIMEIRO grupo cuja regra ele casa, então a ordem
    # aqui importa: a família do React vem antes do grupo genérico.
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

      desenvolvimento:
        dependency-type: development
        # `typescript` sai do grupo de propósito. Ele arrasta o peer do
        # `typescript-eslint` junto, e no grupo fez um PR de sete atualizações
        # inteiro falhar por causa de um membro só. Sozinho, ele falha sozinho.
        exclude-patterns:
          - typescript
