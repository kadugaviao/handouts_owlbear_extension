name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` instala exatamente o que está no package-lock.json e falha se
      # ele estiver dessincronizado — é o que garante a mesma árvore aqui e na
      # máquina de quem desenvolve.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # `npm run build` já é `tsc --noEmit && vite build`: a checagem de tipos
      # está inclusa, então não há passo separado de tsc.
      - name: Build
        run: npm run build
